<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/gestion_commerciale

    # Trust the reverse proxy (Caddy) so Apache builds https:// URLs
    # when the client reached us over TLS.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/gestion_commerciale>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
