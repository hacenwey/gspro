services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion_commerciale-app:latest
    container_name: gestion_commerciale_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_SSL: "false"
    ports:
      - "80:80"
    volumes:
      - app_uploads:/var/www/html/gestion_commerciale/public/uploads
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gestion_net

  db:
    image: mysql:8.0
    container_name: gestion_commerciale_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    env_file:
      - .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./database/master_schema.sql:/docker-entrypoint-initdb.d/01-master_schema.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-default_tenant_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gestion_net

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: gestion_commerciale_pma
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    networks:
      - gestion_net

volumes:
  db_data:
  app_uploads:

networks:
  gestion_net:
    driver: bridge
